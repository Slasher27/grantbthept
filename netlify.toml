# Keystatic path normalisation. The admin SPA and its API call themselves WITHOUT a
# trailing slash, which trailingSlash:'always' 404s — this is what broke the Keystatic
# Cloud OAuth callback (/keystatic/cloud/oauth/callback → 404, login could not complete).
# We must NOT relax 'always' globally: it is what keeps the legacy indexed URLs intact
# (specs/02, CRITICAL). So we normalise ONLY the Keystatic paths, here at the edge,
# before Astro's router sees them. Content URLs are untouched.

# Convenience: typing /keystatic without the slash shouldn't dead-end (Grant will).
[[redirects]]
  from = "/keystatic"
  to = "/keystatic/"
  status = 301

# API: Keystatic never calls these with a trailing slash, so add one and the
# /api/keystatic/[...params] route matches. 200 = rewrite, so the method, body and
# query string are preserved (a 301 would break POSTs).
[[redirects]]
  from = "/api/keystatic/*"
  to = "/api/keystatic/:splat/"
  status = 200
  force = true

# Admin SPA: /keystatic/[...params] renders a client-only React shell — the params do not
# affect the server output, the SPA reads the URL in the browser. Serving /keystatic/ for
# any sub-path is therefore equivalent, and it sidesteps the trailing-slash 404 (including
# the OAuth callback, whose ?code/&state survive the rewrite).
[[redirects]]
  from = "/keystatic/*"
  to = "/keystatic/"
  status = 200
  force = true

# Security headers (specs/06). CSP is emitted by Astro's CSP API (astro.config.mjs);
# these are the remaining response headers Netlify applies to every route.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
